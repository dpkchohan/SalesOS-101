kind = "web"
previewPath = "/"
title = "SalesOS"
version = "1.0.0"
id = "artifacts/salesos-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
